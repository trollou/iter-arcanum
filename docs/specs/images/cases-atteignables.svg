<text x="491" y="40" font-size="13" fill="#e8e8e8">Exemple : bac à sable, de jour,</text>
<text x="491" y="58" font-size="13" fill="#e8e8e8">5 points de mouvement.</text>
<text x="491" y="76" font-size="13" fill="#e8e8e8"></text>
<text x="491" y="94" font-size="13" fill="#e8e8e8">Jeton : coût total du trajet le</text>
<text x="491" y="112" font-size="13" fill="#e8e8e8">moins cher, case atteignable.</text>
<text x="491" y="130" font-size="13" fill="#e8e8e8">Contour épais : voisines, seules</text>
<text x="491" y="148" font-size="13" fill="#e8e8e8">cases où un clic déplace.</text>
<text x="491" y="166" font-size="13" fill="#e8e8e8">Voile seul : cases lointaines.</text>
<text x="491" y="184" font-size="13" fill="#e8e8e8"></text>
<text x="491" y="202" font-size="13" fill="#e8e8e8">Pointillé rouge : trajet montré</text>
<text x="491" y="220" font-size="13" fill="#e8e8e8">au survol de la Plaine (coût 5),</text>
<text x="491" y="238" font-size="13" fill="#e8e8e8">par la Forêt (3 + 2).</text>
<text x="491" y="256" font-size="13" fill="#e8e8e8"></text>
<text x="491" y="274" font-size="13" fill="#e8e8e8">(n) en italique : coût total des</text>
<text x="491" y="292" font-size="13" fill="#e8e8e8">cases trop chères, pour l'exemple ;</text>
<text x="491" y="310" font-size="13" fill="#e8e8e8">pas dessiné dans le jeu (survol :</text>
<text x="491" y="328" font-size="13" fill="#e8e8e8">« Il vous manque … »).</text>
