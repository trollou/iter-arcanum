name: CI

# Dépôt public : minutes illimitées, Windows et macOS compris (spec 082, Q6 ; spec #7, Q2).
# - PR : Linux, Windows et macOS au complet, une fois la PR prête (un brouillon ne lance rien), sauf si
#   elle ne touche que de la doc (filtre `paths` ci-dessous, issue #72) ;
# - main : à chaque fusion, les trois OS, ce qui enregistre aussi le cache ;
# - à la main (onglet Actions) : tout, sur les trois OS.
on:
  pull_request:
    # ready_for_review : le passage de brouillon à prête lance la CI.
    types: [opened, synchronize, reopened, ready_for_review]
    # Issue #72 : une PR qui ne touche que la doc ne lance rien. Le dernier motif qui correspond
    # l'emporte : tout, sauf le Markdown, docs/ et .claude/, sauf les fichiers lus par un test.
    # Les fichiers non Markdown de docs/ (images des specs, SVG, PDF égaré) restent dans la CI pour
    # le garde-fou depot_public.rs, qui inspecte tous les fichiers suivis. Un test qui se met à lire
    # un autre fichier de doc : l'ajouter aux exceptions.
    paths:
      - '**'
      - '!**.md'
      - '!.claude/**'
      - '!LICENSE'
      - '!NOTICE'
      - 'docs/**'
      - '!docs/**.md'
      # Exceptions : fichiers Markdown lus par un test.
      - 'assets/**'
      - 'docs/reference/bac-a-sable.md'
      - 'docs/verification-manuelle.md'
      # Matériel de tiers, refusé par depot_public.rs (et ignoré par .gitignore).
      - 'docs/regles/**'
  push:
    branches: [main]
  workflow_dispatch:
  # Spec #33 : appelé tel quel par release.yml, pour ne pas recopier fmt, clippy et test.
  workflow_call:

# Cache (issue : quota de 10 Go plein, éditions de liens en « Bus error ») :
# - seul main enregistre le cache ; les PR le lisent sans en créer, au lieu d'un cache de
#   plusieurs Go par branche qui évince tout le reste ;
# - symboles de débogage réduits aux numéros de ligne : target/ bien plus petit, liens plus rapides
#   (le disque du runner Linux ne suffisait plus : PR privée 222, « No space left on device »).
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Un nouveau push sur une PR annule son exécution en cours (issue #51) ; main garde chacune, car
# chaque exécution de main enregistre le cache.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifier:
    name: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # macos-latest : Apple Silicon ; rien à installer (CoreAudio est fourni, spec #7).
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Spec 081 : le son (cpal, ALSA) demande libasound2-dev pour compiler sous Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # fmt ne dépend pas de l'OS : vérifié sous Linux seulement.
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Garde-fou du dépôt public compris (crates/arcanum-core/tests/depot_public.rs, spec 082).
      - run: cargo test --workspace
