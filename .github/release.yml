# Notes de version générées par `gh release create --generate-notes` (spec #33, issue #64) : PR fusionnées
# depuis la release finale précédente, rangées par leur label de catégorie. Le fil qui ouvre une PR lui met
# l'un des trois (docs/issues.md, Labels) ; Dependabot met `dependencies`.
changelog:
  categories:
    - title: Changements
      labels: [changement]
    - title: Corrections de bugs
      labels: [correction]
    - title: Outillage et documentation
      labels: [outillage, dependencies]
    - title: Autres
      labels: ["*"]
