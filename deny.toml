# Règles de cargo-deny : licences des dépendances compatibles avec la GPL v3 (NOTICE).
# Vérifier : `cargo deny check licenses` (outil : `cargo install --locked cargo-deny`).
# Une dépendance refusée : vérifier sa licence et sa compatibilité avec la GPL v3 avant de l'ajouter ici.

[graph]
# Les cibles du jeu : Windows, Linux et macOS (CLAUDE.md), rien d'autre. Les deux cibles macOS font
# vérifier les dépendances propres à macOS (CoreFoundation, objc2) : spec #33, E2.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[licenses]
# Licences permissives ou à copyleft faible, toutes compatibles avec la GPL v3.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # Polices embarquées par egui (epaint_default_fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Nos crates ne sont pas publiées (publish = false) : leur licence est celle du workspace.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Les dépendances internes (arcanum-core…) sont déclarées par chemin, sans version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Vulnérabilités connues (base RustSec) : signalées par `cargo deny check advisories`, bloquantes pour
# une release (spec #33, D5). Un avis ignoré porte sa justification et le renvoi à son issue.
yanked = "warn"
ignore = [
    # chrono non maintenu : pas une faille, aucune version corrigée. Horodatage des logs et des
    # sauvegardes ; remplacé par jiff ou time dans l'issue #55 (spec #33, D14).
    { id = "RUSTSEC-2026-0543", reason = "chrono non maintenu, pas une faille ; remplacé par l'issue #55" },
]
