    <path d="M76,32 C84,24 84,12 76,4 C76,14 72,20 68,24 Z" fill="url(#stone)"/>
    <path d="M40,44 L24,34 L38,54 Z M80,44 L96,34 L82,54 Z" fill="url(#stone)"/>
