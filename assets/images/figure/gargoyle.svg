    <path d="M28,134 L54,134 L56,146 L24,146 C24,140 25,136 28,134 Z" fill="url(#stone)"/>
    <path d="M66,134 L92,134 C95,136 96,140 96,146 L64,146 Z" fill="url(#stone)"/>
