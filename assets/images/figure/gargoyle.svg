    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f988b"/><stop offset="1" stop-color="#3c423b"/></linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc25a"/><stop offset="1" stop-color="#4f7a2a"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse id="ombre" cx="60" cy="150" rx="50" ry="8" fill="url(#shadow)"/>
