<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e070c4"/><stop offset=".55" stop-color="#a8338e"/><stop offset="1" stop-color="#521446"/></linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9c4d8"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c8b0"/><stop offset="1" stop-color="#a07a68"/></linearGradient>
    <radialGradient id="mist"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ffb0f0"/><stop offset="1" stop-color="#c040b0"/></radialGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse id="ombre" cx="60" cy="150" rx="40" ry="8" fill="url(#shadow)"/>
  <!-- cape : double fantôme décalé derrière (l'illusion), puis la cape étoilée -->
