    <path d="M32,96 L33,99 L36,99 L33.5,101 L34.5,104 L32,102 L29.5,104 L30.5,101 L28,99 L31,99 Z M88,116 L89,119 L92,119 L89.5,121 L90.5,124 L88,122 L85.5,124 L86.5,121 L84,119 L87,119 Z" fill="#ffd94a" stroke-width="1"/>
  </g>
  <!-- jambes : robe longue, babouches pointues -->
