  </g>
  <!-- tête : chapeau pointu à bord tombant, masque blanc souriant -->
  <g id="tete" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M42,48 C42,36 50,30 60,30 C70,30 78,36 78,48 C78,60 70,68 60,68 C50,68 42,60 42,48 Z" fill="url(#skin)"/>
    <path d="M44,40 C44,36 52,34 60,34 C68,34 76,36 76,40 L76,52 C76,62 68,66 60,66 C52,66 44,62 44,52 Z" fill="url(#mask)"/>
