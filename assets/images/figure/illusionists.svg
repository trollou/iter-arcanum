    <circle cx="12" cy="112" r="2" fill="#ffb0f0" stroke="none"/>
  </g>
  <!-- bras droit levé : orbe de brume rose -->
  <g id="bras-droit" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
