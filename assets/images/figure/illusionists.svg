    <circle cx="53" cy="46" r="1.4" fill="#ffb0f0" stroke="none"/><circle cx="67" cy="46" r="1.4" fill="#ffb0f0" stroke="none"/>
    <path d="M50,56 C56,62 64,62 70,56" fill="none" stroke-width="1.8"/>
