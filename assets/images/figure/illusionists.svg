    <path d="M32,135 C42,130 50,140 60,135 C70,130 78,140 88,135" stroke="#ffd94a" stroke-width="2.6" fill="none"/>
  </g>
  <!-- torse : robe à losanges, ceinture -->
  <g id="torse" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M40,62 C38,80 40,94 42,106 L78,106 C80,94 82,80 80,62 C70,56 50,56 40,62 Z" fill="url(#robe)"/>
    <path d="M60,64 L68,76 L60,88 L52,76 Z" fill="#3a1032" stroke-width="1.6"/>
    <path d="M60,70 L64,76 L60,82 L56,76 Z" fill="#ffd94a" stroke-width="1"/>
    <path d="M41,96 L79,96 L78,104 L42,104 Z" fill="#2b1a0c"/>
  </g>
  <!-- bras gauche : main ouverte, brume qui tourne -->
  <g id="bras-gauche" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M40,64 C30,70 24,80 22,90 L36,92 C36,84 40,78 46,74 Z" fill="url(#robe)"/>
    <circle cx="26" cy="94" r="7" fill="url(#skin)"/>
