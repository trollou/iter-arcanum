<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d6b0"/><stop offset="1" stop-color="#b9805a"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#dcd8ea"/><stop offset="1" stop-color="#8a84a6"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2d27a"/><stop offset=".5" stop-color="#d9b24a"/><stop offset="1" stop-color="#8a6524"/></linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f4ff"/><stop offset=".5" stop-color="#8a7cff"/><stop offset="1" stop-color="#3a2a9a"/></linearGradient>
    <linearGradient id="poison" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8f27a"/><stop offset="1" stop-color="#4f9a22"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse id="ombre" cx="60" cy="150" rx="40" ry="8" fill="url(#shadow)"/>
  <!-- cape : manteau blanc doublé de violet -->
  <g id="cape" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M38,56 C24,80 22,112 24,140 L96,140 C98,112 96,80 82,56 Z" fill="#4a3a8a"/>
    <path d="M30,90 C28,110 28,124 30,136 M90,90 C92,110 92,124 90,136" stroke-opacity=".4" stroke-width="1.4" fill="none"/>
  </g>
  <!-- jambes : robe longue, bordure d'or -->
  <g id="jambes" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M38,138 L56,138 L56,146 L30,146 C30,142 34,138 38,138 Z" fill="#2b1a0c"/>
    <path d="M64,138 L82,138 C86,138 90,142 90,146 L64,146 Z" fill="#2b1a0c"/>
    <path d="M42,100 C38,114 34,128 32,140 L88,140 C86,128 82,114 78,100 Z" fill="url(#robe)"/>
    <path d="M33,135 L87,135" stroke="#d9b24a" stroke-width="3.2" fill="none"/>
    <path d="M60,104 L60,132" stroke="#d9b24a" stroke-width="2.4" fill="none"/>
  </g>
  <!-- torse : robe blanche, étole d'or -->
  <g id="torse" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M40,62 C38,80 40,94 42,106 L78,106 C80,94 82,80 80,62 C70,56 50,56 40,62 Z" fill="url(#robe)"/>
    <path d="M48,60 L54,106 L46,106 L42,64 Z M72,60 L66,106 L74,106 L78,64 Z" fill="url(#gold)" stroke-width="1.6"/>
    <path d="M41,96 L79,96 L78,104 L42,104 Z" fill="#4a3a8a"/>
    <circle cx="60" cy="100" r="4.5" fill="url(#cold)" stroke-width="1.6"/>
  </g>
  <!-- bras gauche : bâton d'or au soleil, fiole de poison pendue -->
  <g id="bras-gauche" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M20,146 L22,30 L28,30 L27,146 Z" fill="url(#gold)"/>
    <circle cx="25" cy="22" r="8" fill="url(#gold)"/>
    <circle cx="25" cy="22" r="3.6" fill="url(#cold)" stroke-width="1.4"/>
    <path d="M25,8 L25,11 M25,33 L25,36 M11,22 L14,22 M36,22 L39,22 M15,12 L17,14 M33,30 L35,32 M35,12 L33,14 M15,32 L17,30" stroke="#d9b24a" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M40,64 C30,70 24,80 22,90 L36,94 C36,86 40,78 46,74 Z" fill="url(#robe)"/>
    <path d="M22,90 L36,94" stroke="#d9b24a" stroke-width="3" fill="none"/>
    <path d="M14,104 L14,98 L18,98 L18,104 C22,106 22,114 16,116 C10,114 10,106 14,104 Z" fill="url(#poison)" stroke-width="1.6"/>
    <path d="M16,98 L22,94" stroke-width="1.4" fill="none"/>
    <circle cx="25" cy="94" r="7" fill="url(#skin)"/>
  </g>
  <!-- bras droit : feu froid levé (flamme violette et bleue) -->
  <g id="bras-droit" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M80,64 C90,62 96,56 98,46 L86,40 C84,50 80,54 74,58 Z" fill="url(#robe)"/>
    <path d="M86,40 L98,46" stroke="#d9b24a" stroke-width="3" fill="none"/>
    <circle cx="93" cy="38" r="7" fill="url(#skin)"/>
    <path d="M93,30 C82,26 82,12 90,6 C90,12 94,14 94,8 C98,12 102,6 100,0 C112,8 110,26 93,30 Z" fill="url(#cold)" stroke-width="1.6"/>
    <path d="M94,26 C90,22 90,16 94,12 C96,16 100,18 98,24 Z" fill="#e8f4ff" stroke="none"/>
    <circle cx="108" cy="30" r="1.8" fill="#c8f27a" stroke="none"/><circle cx="84" cy="22" r="1.8" fill="#c8f27a" stroke="none"/>
  </g>
  <!-- tête : haute mitre blanche et or, visage glabre, yeux qui luisent -->
  <g id="tete" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M44,48 C44,36 50,30 60,30 C70,30 76,36 76,48 C76,60 70,66 60,66 C50,66 44,60 44,48 Z" fill="url(#skin)"/>
    <path d="M44,34 C42,22 50,8 60,2 C70,8 78,22 76,34 C66,30 54,30 44,34 Z" fill="url(#robe)"/>
    <path d="M60,4 L60,30 M44,34 C54,30 66,30 76,34" stroke="#d9b24a" stroke-width="3" fill="none"/>
    <path d="M60,12 L64,18 L60,24 L56,18 Z" fill="url(#cold)" stroke-width="1.4"/>
    <path d="M48,42 L56,45 M72,42 L64,45" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <ellipse cx="52" cy="49" rx="3" ry="2.4" fill="#b8b0ff" stroke-width="1"/><ellipse cx="68" cy="49" rx="3" ry="2.4" fill="#b8b0ff" stroke-width="1"/>
    <path d="M54,58 C57,56 63,56 66,58" fill="none" stroke-width="1.8"/>
    <path d="M42,38 C40,48 42,56 46,62 M78,38 C80,48 78,56 74,62" stroke="#4a3a8a" stroke-width="2.4" fill="none"/>
  </g>
</svg>
