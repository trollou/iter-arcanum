<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d6b0"/><stop offset="1" stop-color="#b9805a"/></linearGradient>
    <linearGradient id="tabard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f78c4"/><stop offset=".55" stop-color="#2d4c8c"/><stop offset="1" stop-color="#172a52"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".5" stop-color="#aab4bf"/><stop offset="1" stop-color="#5f6b78"/></linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aab4bf"/><stop offset="1" stop-color="#4c5560"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a34"/><stop offset="1" stop-color="#553419"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse id="ombre" cx="60" cy="150" rx="44" ry="8" fill="url(#shadow)"/>
  <!-- jambes : chausses de mailles, solerets -->
  <g id="jambes" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M44,104 L42,132 L56,134 L58,106 Z" fill="url(#mail)"/>
    <path d="M62,106 L64,134 L78,132 L76,104 Z" fill="url(#mail)"/>
    <path d="M38,128 L57,130 L57,146 L30,146 C30,138 33,132 38,128 Z" fill="url(#steel)"/>
    <path d="M63,130 L82,128 C87,132 90,138 90,146 L63,146 Z" fill="url(#steel)"/>
  </g>
  <!-- torse : haubert, tabard bleu à la tour d'or -->
  <g id="torse" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M38,60 C36,80 36,96 40,108 L80,108 C84,96 84,80 82,60 C72,54 48,54 38,60 Z" fill="url(#mail)"/>
    <path d="M46,60 L74,60 L76,122 L60,116 L44,122 Z" fill="url(#tabard)"/>
    <path d="M54,70 L54,64 L57,64 L57,67 L59,67 L59,64 L61,64 L61,67 L63,67 L63,64 L66,64 L66,70 L64,72 L64,84 L56,84 L56,72 Z" fill="#d9b24a" stroke-width="1.4"/>
    <path d="M40,96 L80,96 L80,104 L40,104 Z" fill="#2b1a0c"/>
    <rect x="55" y="95" width="10" height="10" rx="2" fill="#d9b24a"/>
  </g>
  <!-- bras droit : lance dressée -->
  <g id="bras-droit" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M90,144 L92,20 L97,20 L96,144 Z" fill="url(#wood)"/>
    <path d="M94.5,0 C100,8 101,16 98,22 L91,22 C88,16 89,8 94.5,0 Z" fill="url(#steel)"/>
    <path d="M88,24 L101,24 L100,28 L89,28 Z" fill="#d9b24a" stroke-width="1.6"/>
    <path d="M80,62 C90,66 94,76 94,88 L82,90 C82,82 80,76 74,72 Z" fill="url(#mail)"/>
    <circle cx="92" cy="92" r="7" fill="url(#steel)"/>
  </g>
  <!-- tête : casque à nasal, camail -->
  <g id="tete" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M40,40 C38,56 42,66 60,68 C78,66 82,56 80,40 Z" fill="url(#mail)"/>
    <path d="M46,40 C46,56 52,64 60,64 C68,64 74,56 74,40 Z" fill="url(#skin)"/>
    <path d="M48,46 L56,48 M72,46 L64,48" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <circle cx="52" cy="51" r="2.2" fill="#17120c" stroke="none"/><circle cx="68" cy="51" r="2.2" fill="#17120c" stroke="none"/>
    <path d="M53,59 C57,58 63,58 67,59" fill="none" stroke-width="1.8"/>
    <path d="M42,42 C40,26 48,14 60,14 C72,14 80,26 78,42 Z" fill="url(#steel)"/>
    <path d="M57,40 L63,40 L62,56 L58,56 Z" fill="url(#steel)" stroke-width="1.6"/>
    <path d="M42,38 L78,38" stroke-width="1.6" stroke-opacity=".6" fill="none"/>
    <path d="M48,24 C51,20 54,18 58,18" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
  <!-- bras gauche : grand pavois devant, qui couvre le flanc (fortifié) -->
  <g id="bras-gauche" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M10,66 C24,62 40,62 54,66 L54,112 C54,126 40,136 32,140 C24,136 10,126 10,112 Z" fill="url(#tabard)"/>
    <path d="M14,70 C26,66 38,66 50,70 L50,111 C50,123 39,131 32,135 C25,131 14,123 14,111 Z" fill="none" stroke="#d9b24a" stroke-width="2.4"/>
    <path d="M26,92 L26,84 L29,84 L29,88 L31,88 L31,84 L33,84 L33,88 L35,88 L35,84 L38,84 L38,92 L36,94 L36,110 L28,110 L28,94 Z" fill="#d9b24a" stroke-width="1.4"/>
    <path d="M18,72 C24,70 30,70 36,70" stroke="#fff" stroke-opacity=".5" stroke-width="1.4" fill="none"/>
  </g>
</svg>
