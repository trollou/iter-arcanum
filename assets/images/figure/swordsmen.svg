<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d6b0"/><stop offset="1" stop-color="#b9805a"/></linearGradient>
    <linearGradient id="tabard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3b64a"/><stop offset=".55" stop-color="#b8862a"/><stop offset="1" stop-color="#6e4c14"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".5" stop-color="#aab4bf"/><stop offset="1" stop-color="#5f6b78"/></linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aab4bf"/><stop offset="1" stop-color="#4c5560"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a34"/><stop offset="1" stop-color="#553419"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse id="ombre" cx="60" cy="150" rx="40" ry="8" fill="url(#shadow)"/>
  <!-- jambes : jambes écartées, bottes -->
  <g id="jambes" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M44,104 L38,132 L52,134 L58,106 Z" fill="#4a4036"/>
    <path d="M62,106 L68,134 L82,132 L76,104 Z" fill="#4a4036"/>
    <path d="M34,126 L53,128 L53,146 L26,146 C26,138 29,130 34,126 Z" fill="url(#leather)"/>
    <path d="M67,128 L86,126 C91,130 94,138 94,146 L67,146 Z" fill="url(#leather)"/>
  </g>
  <!-- torse : haubert, tabard moutarde écartelé -->
  <g id="torse" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M38,60 C36,80 36,96 40,108 L80,108 C84,96 84,80 82,60 C72,54 48,54 38,60 Z" fill="url(#mail)"/>
    <path d="M42,62 L78,62 L80,118 L40,118 Z" fill="url(#tabard)"/>
    <path d="M60,62 L60,96 M42,80 L78,80" stroke="#6e1712" stroke-width="3.2" fill="none"/>
    <path d="M40,96 L80,96 L80,104 L40,104 Z" fill="#2b1a0c"/>
    <rect x="55" y="95" width="10" height="10" rx="2" fill="#f4f7fa"/>
    <path d="M44,106 L42,118 M76,106 L78,118" stroke-width="1.4" stroke-opacity=".5" fill="none"/>
  </g>
  <!-- bras gauche : rondache cerclée -->
  <g id="bras-gauche" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M40,62 C30,66 26,76 28,86 L40,88 C40,80 42,74 48,70 Z" fill="url(#mail)"/>
    <circle cx="28" cy="92" r="19" fill="#6e1712"/>
    <circle cx="28" cy="92" r="15" fill="url(#tabard)" stroke-width="1.6"/>
    <circle cx="28" cy="92" r="5" fill="url(#steel)"/>
    <path d="M17,82 C20,78 24,76 28,76" stroke="#fff" stroke-opacity=".6" stroke-width="1.4" fill="none"/>
  </g>
  <!-- bras droit : épée levée -->
  <g id="bras-droit" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M93,62 L98,4 L103,12 L99,62 Z" fill="url(#steel)"/>
    <path d="M98,10 L98,58" stroke="#fff" stroke-opacity=".7" stroke-width="1.2" fill="none"/>
    <path d="M86,62 L106,64 L106,69 L86,67 Z" fill="#d9b24a"/>
    <path d="M94,68 L93,78 L98,78 L99,68 Z" fill="#2b1a0c"/>
    <circle cx="95.5" cy="81" r="3" fill="#d9b24a"/>
    <path d="M78,62 C88,62 94,66 96,72 L90,82 C86,76 80,74 72,72 Z" fill="url(#mail)"/>
    <circle cx="96" cy="72" r="7" fill="url(#skin)"/>
  </g>
  <!-- tête : casque ouvert à plumet rouge -->
  <g id="tete" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M58,16 C52,4 62,-2 72,4 C66,4 64,10 66,18 Z" fill="#b8322a"/>
    <path d="M44,42 C44,58 50,66 60,66 C70,66 76,58 76,42 Z" fill="url(#skin)"/>
    <path d="M48,46 L56,49 M72,46 L64,49" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <circle cx="52" cy="52" r="2.2" fill="#17120c" stroke="none"/><circle cx="68" cy="52" r="2.2" fill="#17120c" stroke="none"/>
    <path d="M52,58 C56,62 64,62 68,58 L60,64 Z" fill="#6b4320" stroke-width="1.4"/>
    <path d="M40,46 C38,26 48,16 60,16 C72,16 82,26 80,46 L76,46 L76,40 L44,40 L44,46 Z" fill="url(#steel)"/>
    <path d="M40,46 L44,46 L44,58 L40,56 Z M80,46 L76,46 L76,58 L80,56 Z" fill="url(#steel)" stroke-width="1.6"/>
    <path d="M40,36 L80,36" stroke="#d9b24a" stroke-width="3" fill="none"/>
    <path d="M47,25 C50,21 54,19 58,19" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
