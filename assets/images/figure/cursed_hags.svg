<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9c48f"/><stop offset="1" stop-color="#66714c"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5fae"/><stop offset=".55" stop-color="#5b3a78"/><stop offset="1" stop-color="#2f1d40"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a7448"/><stop offset="1" stop-color="#4f3820"/></linearGradient>
    <linearGradient id="poison" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2ff8a"/><stop offset=".5" stop-color="#8fe03a"/><stop offset="1" stop-color="#3f8a1a"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse id="ombre" cx="60" cy="150" rx="40" ry="8" fill="url(#shadow)"/>
  <!-- cape : châle en lambeaux, derrière -->
