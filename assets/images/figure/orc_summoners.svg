<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc267"/><stop offset="1" stop-color="#55773a"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f9a9a"/><stop offset=".55" stop-color="#25686c"/><stop offset="1" stop-color="#143c40"/></linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6a4a"/><stop offset="1" stop-color="#4a3622"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a7448"/><stop offset="1" stop-color="#4f3820"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#9ff0ff"/><stop offset="1" stop-color="#2fb6d6"/></radialGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse id="ombre" cx="60" cy="150" rx="40" ry="8" fill="url(#shadow)"/>
  <!-- cape : peau de bête sur les épaules -->
  <g id="cape" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M36,56 C24,76 22,108 26,134 L34,128 L40,136 L46,126 L74,126 L80,136 L86,128 L94,134 C98,108 96,76 84,56 Z" fill="url(#fur)"/>
  </g>
  <!-- jambes : robe longue, bottes de cuir -->
  <g id="jambes" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M37,132 L57,134 L57,146 L30,146 C30,140 33,135 37,132 Z" fill="#553419"/>
    <path d="M63,134 L83,132 C87,135 90,140 90,146 L63,146 Z" fill="#553419"/>
    <path d="M42,100 C38,114 36,126 34,138 L86,138 C84,126 82,114 78,100 Z" fill="url(#robe)"/>
    <path d="M36,132 L84,132" stroke="#d9b24a" stroke-width="3.2" fill="none"/>
    <path d="M60,104 L60,130" stroke-opacity=".45" stroke-width="1.4" fill="none"/>
  </g>
  <!-- torse : robe, colliers d'os, ceinture -->
  <g id="torse" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M40,62 C38,80 40,94 42,106 L78,106 C80,94 82,80 80,62 C70,56 50,56 40,62 Z" fill="url(#robe)"/>
    <path d="M46,66 C52,78 68,78 74,66" stroke="#fbf6e6" stroke-width="1.6" fill="none"/>
    <path d="M50,72 L48,78 L52,76 Z M60,76 L60,83 L62,77 Z M70,72 L72,78 L68,76 Z" fill="#fbf6e6" stroke-width="1.2"/>
    <path d="M41,96 L79,96 L78,104 L42,104 Z" fill="#2b1a0c"/>
    <circle cx="60" cy="100" r="5" fill="url(#glow)" stroke-width="1.6"/>
  </g>
  <!-- bras gauche : bâton totem, orbe tenu dans une griffe -->
  <g id="bras-gauche" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <g transform="translate(-6,0)">
    <path d="M20,146 L22,30 L28,30 L27,146 Z" fill="url(#wood)"/>
    <path d="M16,28 C14,20 18,12 22,10 L22,22 M34,28 C36,20 32,12 28,10 L28,22" fill="none" stroke-width="2.4"/>
    <circle cx="25" cy="18" r="8" fill="url(#glow)"/>
    <path d="M14,34 L36,34 L34,40 L16,40 Z" fill="#fbf6e6" stroke-width="1.6"/>
    <path d="M22,42 L14,52 M28,42 L36,54" stroke="#b8322a" stroke-width="2.4" fill="none"/>
    </g>
    <path d="M40,64 C30,70 24,80 22,90 L36,92 C36,84 40,78 46,74 Z" fill="url(#robe)"/>
    <circle cx="24" cy="92" r="7" fill="url(#skin)"/>
  </g>
  <!-- bras droit levé : magie d'invocation en volute -->
  <g id="bras-droit" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M80,64 C90,62 96,56 98,46 L88,42 C86,50 82,54 74,58 Z" fill="url(#robe)"/>
    <circle cx="94" cy="40" r="7" fill="url(#skin)"/>
    <path d="M94,32 C84,26 86,10 98,8 C110,6 116,18 110,26 C106,32 98,30 98,24 C98,18 106,18 106,22" fill="none" stroke="#2fb6d6" stroke-width="5" stroke-linecap="round"/>
    <path d="M94,32 C84,26 86,10 98,8 C110,6 116,18 110,26 C106,32 98,30 98,24 C98,18 106,18 106,22" fill="none" stroke="#e8fbff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="86" cy="22" r="1.8" fill="#9ff0ff" stroke="none"/><circle cx="114" cy="34" r="1.8" fill="#9ff0ff" stroke="none"/><circle cx="104" cy="2" r="1.4" fill="#9ff0ff" stroke="none"/>
  </g>
  <!-- tête : crâne de bête cornu porté en coiffe, plumes -->
  <g id="tete" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M38,40 L26,14 L32,16 L44,32 Z M82,40 L94,14 L88,16 L76,32 Z" fill="#b8322a"/>
    <path d="M42,48 C42,36 50,30 60,30 C70,30 78,36 78,48 C78,60 70,68 60,68 C50,68 42,60 42,48 Z" fill="url(#skin)"/>
    <path d="M40,40 C36,30 40,18 60,16 C80,18 84,30 80,40 C74,36 68,34 60,34 C52,34 46,36 40,40 Z" fill="#fbf6e6"/>
    <path d="M42,26 C32,18 26,8 30,2 C34,10 40,16 48,20 Z M78,26 C88,18 94,8 90,2 C86,10 80,16 72,20 Z" fill="#fbf6e6"/>
    <path d="M52,24 C54,28 56,28 58,24 M62,24 C64,28 66,28 68,24" fill="#17120c" stroke-width="1.6"/>
    <path d="M60,28 L60,34" stroke-width="1.4" fill="none"/>
    <path d="M46,44 L56,48 M74,44 L64,48" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <ellipse cx="52" cy="50" rx="3.4" ry="2.6" fill="#9ff0ff" stroke-width="1"/>
    <ellipse cx="68" cy="50" rx="3.4" ry="2.6" fill="#9ff0ff" stroke-width="1"/>
    <path d="M44,42 L48,56 M76,42 L72,56" stroke="#2fb6d6" stroke-width="1.6" fill="none"/>
    <path d="M57,54 L60,58 L63,54" fill="#55773a" stroke-width="1.4"/>
    <path d="M50,61 C56,64 64,64 70,61" fill="none" stroke-width="2"/>
    <path d="M51,62 L53,54 L56,62 Z M69,62 L67,54 L64,62 Z" fill="#fbf6e6" stroke-width="1.3"/>
  </g>
</svg>
