    <path d="M42,98 C36,112 32,126 32,138 L46,134 L54,140 L60,134 L66,140 L74,134 L88,138 C88,126 84,112 78,98 Z" fill="url(#robe)"/>
    <path d="M54,104 L52,138 L60,134 L68,138 L66,104 Z" fill="#e0aa4e" stroke-width="1.6"/>
    <path d="M40,116 C38,124 37,130 37,135 M80,116 C82,124 83,130 83,135" stroke-width="1.5" stroke-opacity=".5" fill="none"/>
  </g>
  <!-- haut de la robe, écharpe, médaillon -->
  <g id="torse" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M40,62 C38,80 40,96 43,106 L77,106 C80,96 82,80 80,62 C70,56 50,56 40,62 Z" fill="url(#robe)"/>
    <path d="M46,62 L60,86 L74,62" stroke="#e0aa4e" stroke-width="5" fill="none"/>
    <path d="M46,62 L60,86 L74,62" stroke-width="1.3" stroke-opacity=".5" fill="none"/>
    <path d="M42,96 L78,96 L77,106 L43,106 Z" fill="#7a2a1c"/>
    <path d="M62,104 L60,120 L68,122 L69,104 Z" fill="#7a2a1c"/>
    <circle cx="60" cy="87" r="5.4" fill="#d9b24a"/>
    <circle cx="60" cy="87" r="1.8" fill="#8a6524" stroke="none"/>
  </g>
  <!-- bras gauche : manche large, main griffue -->
  <g id="bras-gauche" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
