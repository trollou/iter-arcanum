  <g id="bras-droit" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <circle cx="100" cy="24" r="19" fill="url(#glow)" stroke="none"/>
    <circle cx="100" cy="24" r="8.5" fill="#dff1ff" stroke="#4a8fd0" stroke-width="1.6"/>
    <path d="M95,24 C95,19 103,18 104,23 C105,27 99,28 99,25" stroke="#4a8fd0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M79,62 L92,46 L105,54 L101,78 C94,84 84,80 77,74 Z" fill="url(#robe)"/>
    <path d="M90,49 L103,57" stroke="#e0aa4e" stroke-width="3" fill="none"/>
    <path d="M91,47 C90,40 93,36 99,37 C105,36 109,40 106,47 L103,52 L93,50 Z" fill="url(#scale)"/>
    <path d="M91,43 L88,36 L94,39 M107,43 L111,36 L104,39" fill="#fbf6e6" stroke-width="1.3"/>
  </g>
  <!-- tête de dragon : cornes, collerettes, museau -->
  <g id="tete" stroke="#17120c" stroke-width="2.2" stroke-linejoin="round">
    <path d="M49,30 C41,24 37,14 40,3 C43,12 49,18 58,22 Z" fill="url(#horn)"/>
    <path d="M71,30 C79,24 83,14 80,3 C77,12 71,18 62,22 Z" fill="url(#horn)"/>
    <path d="M43,42 L29,34 L34,45 L27,50 L36,53 L32,60 L46,56 Z" fill="#1b4d22"/>
    <path d="M77,42 L91,34 L86,45 L93,50 L84,53 L88,60 L74,56 Z" fill="#1b4d22"/>
    <path d="M42,46 C40,32 48,22 60,22 C72,22 80,32 78,46 C78,52 76,55 74,57 L74,62 C70,69 50,69 46,62 L46,57 C44,55 42,52 42,46 Z" fill="url(#scale)"/>
    <path d="M56,23 L60,15 L64,23" fill="url(#scale)"/>
    <path d="M48,54 C52,49 68,49 72,54 L73,62 C69,68 51,68 47,62 Z" fill="url(#belly)"/>
    <path d="M53,30 C56,28 58,28 60,30 C62,28 64,28 67,30 M55,35 C58,33 62,33 65,35" stroke-width="1.3" stroke-opacity=".45" fill="none"/>
    <path d="M45,38 L57,43 M75,38 L63,43" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M47,43 L56,45 C55,49 49,49 47,43 Z M73,43 L64,45 C65,49 71,49 73,43 Z" fill="#ffd94a" stroke-width="1.2"/>
    <path d="M52,44.5 L52,47.5 M68,44.5 L68,47.5" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M55,55 L57,57 M65,55 L63,57" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M49,61 C55,64 65,64 71,61" stroke-width="1.8" fill="none"/>
    <path d="M51,62 L53,66 L55,63 Z M69,62 L67,66 L65,63 Z" fill="#fbf6e6" stroke-width="1.2"/>
  </g>
</svg>
