<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fc46a"/><stop offset=".5" stop-color="#2e7d32"/><stop offset="1" stop-color="#1b4d22"/></linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe39a"/><stop offset="1" stop-color="#8fb262"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c98538"/><stop offset=".55" stop-color="#99591f"/><stop offset="1" stop-color="#5e3312"/></linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf6e6"/><stop offset="1" stop-color="#a08c54"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#e8f6ff" stop-opacity=".95"/><stop offset=".45" stop-color="#7fc8ff" stop-opacity=".6"/><stop offset="1" stop-color="#4aa0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse id="ombre" cx="60" cy="150" rx="42" ry="8" fill="url(#shadow)"/>
  <!-- queue, derrière la robe -->
