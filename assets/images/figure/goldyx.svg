    <path d="M25,111 L26,117 L29,112 M31,113 L32,118 L35,111" fill="#fbf6e6" stroke-width="1.3"/>
    <path d="M40,62 C28,68 20,84 20,104 L42,106 C40,94 42,82 47,74 Z" fill="url(#robe)"/>
    <path d="M22,98 L41,100" stroke="#e0aa4e" stroke-width="3" fill="none"/>
  </g>
