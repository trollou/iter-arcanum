<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Icône du jeu Iter Arcanum (spec 004) : un bouclier bleu nuit liseré d'or, un cristal violet lumineux et deux étincelles. Créée par nous (2026-11-13). -->
  <defs>
    <linearGradient id="nuit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E4A8C"/><stop offset="1" stop-color="#121B36"/></linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#D98E00"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E2C8FF" stop-opacity="0.9"/><stop offset="1" stop-color="#A66BFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="cristal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4E6FF"/><stop offset="0.5" stop-color="#B57CFF"/><stop offset="1" stop-color="#5A23B0"/></linearGradient>
  </defs>
