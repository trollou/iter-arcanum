  <circle cx="128" cy="122" r="78" fill="url(#halo)"/>
  <g stroke="#3B2A1E" stroke-width="5" stroke-linejoin="round">
    <polygon points="128,52 168,112 128,196 88,112" fill="url(#cristal)"/>
    <polyline points="88,112 128,124 168,112" fill="none" stroke-width="3"/>
    <line x1="128" y1="52" x2="128" y2="196" stroke-width="3"/>
